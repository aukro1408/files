<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Плагины</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0e;--tx:#f4f2f0;--mut:#8d8a93;--line:rgba(255,255,255,.1);--glass:rgba(255,255,255,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#101014 0%,#08080a 60%,#060608 100%);background-attachment:fixed;color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;max-width:1000px;margin:0 auto;padding:28px 20px 8px}
h1{font-size:28px;letter-spacing:-.02em;margin:0;font-weight:700}
.add{background:var(--glass);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font:600 14px inherit;font-family:inherit;cursor:pointer;backdrop-filter:blur(12px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;max-width:1000px;margin:0 auto;padding:16px 20px 40px}
.search{max-width:1000px;margin:0 auto;padding:6px 20px 0}
.search input{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:13px 20px;backdrop-filter:blur(12px);color:var(--tx)}
.search input::placeholder{color:var(--mut)}
.card{position:relative;border-radius:28px;padding:22px;min-height:290px;display:flex;flex-direction:column;overflow:hidden;background:#141318;border:1px solid var(--line)}
.card::before{content:"";position:absolute;inset:-50%;background:radial-gradient(45% 45% at 28% 72%,var(--c1),transparent 70%),radial-gradient(45% 45% at 74% 26%,var(--c2),transparent 70%),radial-gradient(35% 35% at 70% 75%,var(--c1),transparent 70%);opacity:.7;pointer-events:none;animation:spin 20s linear infinite,hue 8s ease-in-out infinite alternate}
.card:nth-child(2n)::before{animation-duration:26s,10s;animation-direction:reverse,alternate}
.card:nth-child(3n)::before{animation-duration:16s,7s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hue{0%{filter:hue-rotate(-35deg) saturate(1.1)}100%{filter:hue-rotate(45deg) saturate(1.5)}}
@media (prefers-reduced-motion:reduce){.card::before{animation:none}}
.card>*{position:relative}
.top{display:flex;justify-content:space-between;align-items:center}
.tag{font-size:12px;padding:5px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px)}
.edit{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--tx);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(12px)}
.edit:hover{background:rgba(255,255,255,.16)}
.name{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:auto 0 8px;padding-top:40px}
.desc{color:#cfcbd3;font-size:14px;margin:0 0 16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.url{font-size:12px;color:var(--mut);padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:12px}
.row{display:flex;gap:10px}
.btn{flex:1;text-align:center;text-decoration:none;background:#fff;color:#111;font-weight:600;border-radius:999px;padding:13px;border:0;cursor:pointer;font-family:inherit;font-size:15px}
.btn.off{opacity:.4;pointer-events:none}
.copy{flex:0 0 auto;padding:13px 18px;background:var(--glass);color:var(--tx);border:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:9;backdrop-filter:blur(6px)}
.modal.on{display:flex}
.sheet{width:100%;max-width:420px;background:#17161b;border:1px solid var(--line);border-radius:24px;padding:22px;max-height:100%;overflow:auto}
.sheet h2{margin:0 0 14px;font-size:20px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
input,textarea{width:100%;background:#0e0d11;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;outline:none}
input:focus,textarea:focus{border-color:#7a7aff}
textarea{resize:vertical;min-height:70px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw button.on{border-color:#fff}
.acts{display:flex;gap:10px;margin-top:20px}
.del{background:none;border:1px solid #5a2a2a;color:#ff8a8a;border-radius:999px;padding:12px 16px;cursor:pointer;font-family:inherit}
.tlink{color:#7a7aff}
</style>
</head>
<body>
<header><h1>Мои плагины</h1><button class="add" id="add">+ Добавить</button></header>
<div class="search"><input id="q" placeholder="Поиск по плагинам…" autocomplete="off"></div>
<div class="grid" id="grid"></div>

<div class="modal" id="modal"><div class="sheet">
  <h2 id="mt">Редактировать</h2>
  <label>Название</label><input id="fName">
  <label>Ссылка на плагин</label><input id="fUrl" placeholder="https://..." inputmode="url">
  <label>Метка</label><input id="fTag" placeholder="Lampa, JS…">
  <label>Описание</label><textarea id="fDesc"></textarea>
  <label>Цвет</label><div class="sw" id="sw"></div>
  <div class="acts"><button class="btn" id="save">Сохранить</button><button class="del" id="del">Удалить</button><button class="del" style="border-color:var(--line);color:var(--mut)" id="cancel">Отмена</button></div>
</div></div>

<div class="modal" id="tmodal"><div class="sheet">
  <h2>Ключ GitHub</h2>
  <label>Нужен один раз, чтобы сайт мог сохранять. Дальше запомнится.</label>
  <label><a class="tlink" href="https://github.com/settings/tokens/new?scopes=repo&description=files" target="_blank" rel="noopener">Создать ключ</a> → нажми «Generate token» внизу → скопируй</label>
  <input id="fToken" placeholder="Вставь ключ сюда" autocomplete="off">
  <div class="acts"><button class="btn" id="tokSave">Запомнить</button><button class="del" style="border-color:var(--line);color:var(--mut)" id="tokCancel">Отмена</button></div>
</div></div>

<div class="modal" id="pmodal"><div class="sheet">
  <h2>PIN-код</h2>
  <input id="fPin" inputmode="numeric" placeholder="••••••" autocomplete="off" style="text-align:center;letter-spacing:10px;font-size:20px">
  <div class="acts"><button class="btn" id="pinShow">Показать</button><button class="del" style="border-color:var(--line);color:var(--mut)" id="pinCancel">Отмена</button></div>
</div></div>

<script>
const PIN="140809";
const PAL=[["#e0313b","#1f4bd8"],["#7b3cf0","#17b8d6"],["#e8742a","#c0267a"],["#1f9d6b","#2a5ad8"]];
const PENCIL='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
const GH="https://api.github.com/repos/aukro1408/files/contents/plugins.json";
const LOADER_URL=location.origin+location.pathname.split("/").slice(0,-1).join("/")+"/loader.js?v=1";
let cards=[],cur=null,col=0,pending=null,pinNext=null,query="";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const token=()=>{try{return localStorage.getItem("pp_gh_token")||""}catch(e){return ""}};
let pinOk=false;try{localStorage.removeItem("pp_pin_ok")}catch(e){}
const unlocked=()=>pinOk;
const b64=s=>btoa(unescape(encodeURIComponent(s)));

function load(){
  fetch("plugins.json?_="+Date.now()).then(r=>r.json()).then(d=>{
    cards=(d.plugins||[]).map((p,i)=>({id:"p"+i,name:p.name,url:p.url,tag:p.tag||"",desc:p.description||"",c:(p.c|0)%PAL.length,author:p.author||""}));
    cards.unshift({id:"loader",locked:true,name:"Плагин для Lampa",tag:"Lampa",desc:"Вставь ссылку в Lampa: Настройки → Расширения → Добавить плагин. Дальше включай нужное в разделе «Мои плагины» (там же кнопка «Синхронизировать каталог»).",url:LOADER_URL,c:3});
    render();
  });
}
function render(){
  const ok=unlocked();
  const q=query.trim().toLowerCase();
  const list=cards.filter(k=>!q||((k.name||"")+" "+(k.tag||"")+" "+(k.desc||"")+" "+(k.url||"")).toLowerCase().indexOf(q)>=0);
  if(!list.length){$("grid").innerHTML='<div style="color:var(--mut);padding:24px 4px">Ничего не найдено</div>';return}
  $("grid").innerHTML=list.map(k=>{const p=PAL[k.c||0];
  const isLoader=k.id==="loader";
  const urlHtml=(isLoader&&!ok)?"••••••••••••":esc(k.url||"Ссылка не добавлена");
  const rowHtml=(isLoader&&!ok)
    ? `<button class="btn" data-pin="1">Показать по PIN</button>`
    : `<a class="btn ${k.url?"":"off"}" href="${esc(k.url||"#")}" target="_blank" rel="noopener">Открыть</a><button class="btn copy" data-c="${k.id}">Копировать</button>`;
  return `<div class="card" style="--c1:${p[0]};--c2:${p[1]}">
  <div class="top"><span class="tag">${esc(k.tag||"Плагин")}</span>
  ${k.locked?"":`<button class="edit" data-e="${k.id}" aria-label="Редактировать">${PENCIL}</button>`}</div>
  <div class="name">${esc(k.name)}</div><p class="desc">${esc(k.desc||"")}</p>
  <div class="url">${urlHtml}</div>
  <div class="row">${rowHtml}</div></div>`}).join("");
}
function open_(k){
  cur=k;col=k.c||0;$("mt").textContent=k.isNew?"Новая карточка":"Редактировать";
  $("fName").value=k.name;$("fUrl").value=k.url;$("fTag").value=k.tag;$("fDesc").value=k.desc;
  $("del").style.display=k.isNew?"none":"";sw();$("modal").classList.add("on");
}
function sw(){$("sw").innerHTML=PAL.map((p,i)=>`<button class="${i===col?"on":""}" data-i="${i}" style="background:linear-gradient(135deg,${p[0]},${p[1]})"></button>`).join("")}
$("sw").onclick=e=>{const i=e.target.dataset.i;if(i!=null){col=+i;sw()}};
function askPin(next){if(unlocked()){next();return}pinNext=next;$("fPin").value="";$("pmodal").classList.add("on")}
$("grid").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.pin){askPin(()=>{});return}
  if(b.dataset.e){const k=cards.find(k=>k.id==b.dataset.e);if(k&&!k.locked)askPin(()=>open_({...k}));}
  if(b.dataset.c){const k=cards.find(k=>k.id==b.dataset.c);if(k&&k.url){try{navigator.clipboard.writeText(k.url);b.textContent="Скопировано";setTimeout(()=>b.textContent="Копировать",1200)}catch(_){}}}
};
$("add").onclick=()=>askPin(()=>open_({id:Date.now(),name:"",url:"",tag:"",desc:"",c:0,isNew:true}));
$("q").addEventListener("input",e=>{query=e.target.value;render()});
$("cancel").onclick=()=>$("modal").classList.remove("on");
$("modal").onclick=e=>{if(e.target.id==="modal")$("modal").classList.remove("on")};
$("tmodal").onclick=e=>{if(e.target.id==="tmodal"){$("tmodal").classList.remove("on");pending=null}};
$("tokCancel").onclick=()=>{$("tmodal").classList.remove("on");pending=null};
$("tokSave").onclick=()=>{const v=$("fToken").value.trim();if(!v)return;$("fToken").value="";try{localStorage.setItem("pp_gh_token",v)}catch(e){}$("tmodal").classList.remove("on");if(pending){const f=pending;pending=null;f()}};
$("pmodal").onclick=e=>{if(e.target.id==="pmodal"){$("pmodal").classList.remove("on");pinNext=null}};
$("pinCancel").onclick=()=>{$("pmodal").classList.remove("on");pinNext=null};
$("pinShow").onclick=()=>{
  if($("fPin").value.trim()===PIN){
    pinOk=true;
    $("fPin").value="";$("pmodal").classList.remove("on");render();
    if(pinNext){const f=pinNext;pinNext=null;f()}
  }else{
    const b=$("pinShow");b.textContent="Неверный PIN";setTimeout(()=>b.textContent="Показать",1200);$("fPin").value="";
  }
};
function needToken(fn){if(token()){fn();return}pending=fn;$("tmodal").classList.add("on")}
function serverData(){return cards.filter(k=>!k.locked).map(k=>({name:k.name,url:k.url,description:k.desc,tag:k.tag,c:k.c,author:k.author||""}))}
function push(){
  const btn=$("save");btn.textContent="Сохраняю…";btn.classList.add("off");
  const body=JSON.stringify({updateDate:new Date().toISOString().slice(0,10),plugins:serverData()},null,1);
  const headers={"Authorization":"Bearer "+token(),"Accept":"application/vnd.github+json"};
  fetch(GH+"?ref=main",{headers}).then(r=>{if(r.status===401)throw{auth:1};if(!r.ok)throw{};return r.json()})
  .then(cur=>fetch(GH,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},headers),body:JSON.stringify({message:"update via site",content:b64(body),sha:cur.sha,branch:"main"})}))
  .then(r=>{if(r.status===401)throw{auth:1};if(!r.ok)throw{};return r.json()})
  .then(()=>{btn.textContent="Сохранить";btn.classList.remove("off");$("modal").classList.remove("on");load()})
  .catch(e=>{btn.textContent="Сохранить";btn.classList.remove("off");
    if(e&&e.auth){try{localStorage.removeItem("pp_gh_token")}catch(_){}pending=push;$("tmodal").classList.add("on")}
    else{btn.textContent="Ошибка";setTimeout(()=>btn.textContent="Сохранить",1500)}});
}
$("save").onclick=()=>{
  const k={id:cur.id,locked:cur.locked,name:$("fName").value.trim()||"Без названия",url:$("fUrl").value.trim(),tag:$("fTag").value.trim(),desc:$("fDesc").value.trim(),c:col,author:cur.author||""};
  const i=cards.findIndex(x=>x.id===k.id);i<0?cards.push(k):cards[i]=k;
  needToken(push);
};
$("del").onclick=()=>{if(confirm("Удалить карточку?")){cards=cards.filter(x=>x.id!==cur.id);$("modal").classList.remove("on");needToken(push)}};
load();
</script>
</body>
</html>
